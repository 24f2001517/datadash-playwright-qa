name: DataDash QA

on:
  push:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run QA Script 24f2001517@ds.study.iitm.ac.in
        run: node index.js




